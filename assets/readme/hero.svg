<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Live Global Chat - Real-Time Messaging</title>
  <desc id="hero-desc">High-performance real-time messaging application powered by WebSockets, React 19, and Tailwind CSS v4.</desc>

  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070B14" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <radialGradient id="glow" cx="85%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="24" fill="url(#bg-grad)" />
  <rect width="1200" height="380" rx="24" fill="url(#glow)" />
  <rect width="1198" height="378" x="1" y="1" rx="23" fill="none" stroke="#1E293B" stroke-width="2" />

  <!-- Left Side: Identity & Meta -->
  <g transform="translate(64, 52)">
    <!-- Status Eyebrow Badge -->
    <rect width="216" height="32" rx="16" fill="#132438" stroke="#1E3A5F" stroke-width="1.5" />
    <circle cx="18" cy="16" r="5" fill="#10B981" />
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#38BDF8" letter-spacing="0.5">LIVE WEBSOCKET ENGINE</text>

    <!-- Main Title -->
    <text x="0" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="url(#title-grad)" letter-spacing="-1">Live Global Chat</text>

    <!-- Description -->
    <text x="0" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400" fill="#94A3B8">Ultra-smooth real-time chat with hardware-accelerated</text>
    <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400" fill="#94A3B8">CSS transitions, spam defense, and dynamic theme switching.</text>

    <!-- Tech Stack Pill Badges -->
    <g transform="translate(0, 196)">
      <!-- React 19 -->
      <rect width="96" height="34" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="48" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#38BDF8" text-anchor="middle">React 19</text>

      <!-- Tailwind v4 -->
      <g transform="translate(108, 0)">
        <rect width="112" height="34" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="56" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#38BDF8" text-anchor="middle">Tailwind v4</text>
      </g>

      <!-- Socket.IO -->
      <g transform="translate(232, 0)">
        <rect width="102" height="34" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="51" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#F8FAFC" text-anchor="middle">Socket.IO</text>
      </g>

      <!-- Express -->
      <g transform="translate(346, 0)">
        <rect width="90" height="34" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="45" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#F8FAFC" text-anchor="middle">Node.js</text>
      </g>

      <!-- Vite -->
      <g transform="translate(448, 0)">
        <rect width="68" height="34" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#A855F7" text-anchor="middle">Vite</text>
      </g>
    </g>
  </g>

  <!-- Right Side: Native Chat Mock Preview -->
  <g transform="translate(680, 42)">
    <!-- Container Window -->
    <rect width="460" height="296" rx="18" fill="url(#card-grad)" stroke="#27354E" stroke-width="1.5" />

    <!-- Window Top Header Bar -->
    <rect width="460" height="48" rx="18" fill="#162235" />
    <rect width="460" height="12" y="36" fill="#162235" />
    <line x1="0" y1="48" x2="460" y2="48" stroke="#223049" stroke-width="1" />

    <!-- Header Content -->
    <circle cx="28" cy="24" r="5" fill="#10B981" />
    <text x="42" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#F8FAFC">Active Users: 14</text>

    <!-- Theme Toggle Pill Graphic -->
    <rect x="362" y="14" width="76" height="22" rx="11" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <circle cx="374" cy="25" r="7" fill="#3B82F6" />
    <text x="396" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">DARK</text>

    <!-- Message 1 (Other user) -->
    <g transform="translate(20, 66)">
      <text x="4" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#60A5FA">Elena Rostova</text>
      <rect y="20" width="280" height="42" rx="14" fill="#243247" />
      <text x="14" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#E2E8F0">Connected from Tokyo. Low latency.</text>
    </g>

    <!-- System Message -->
    <g transform="translate(120, 142)">
      <text x="110" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-style="italic" fill="#64748B" text-anchor="middle">Marcus joined the chat</text>
    </g>

    <!-- Message 2 (Self user) -->
    <g transform="translate(170, 172)">
      <rect width="270" height="42" rx="14" fill="url(#accent-grad)" />
      <text x="14" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">Welcome! Zero animation flicker.</text>
    </g>

    <!-- Typing Indicator -->
    <text x="24" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-style="italic" fill="#64748B">Elena is typing...</text>

    <!-- Input Bar Mock -->
    <g transform="translate(20, 248)">
      <rect width="420" height="36" rx="18" fill="#0B1322" stroke="#25354F" stroke-width="1" />
      <circle cx="20" cy="18" r="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <path d="M17 18h6M20 15v6" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" />
      <text x="38" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#475569">Type a message...</text>
      <circle cx="398" cy="18" r="12" fill="#3B82F6" />
      <polygon points="394,14 404,18 394,22" fill="#FFFFFF" />
    </g>
  </g>
</svg>
